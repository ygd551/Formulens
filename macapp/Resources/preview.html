<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- 只允许加载应用内的本地文件，禁止任何网络请求（识别结果来自截图内容，不可信） -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src file: 'unsafe-inline'; style-src file: 'unsafe-inline'; font-src file:; img-src file: data:">
<link rel="stylesheet" href="katex/katex.min.css">
<script src="katex/katex.min.js"></script>
<script src="katex/contrib/auto-render.min.js"></script>
<style>
:root { color-scheme: light dark; --text: #1d1d1f; --border: #d2d2d7; }
@media (prefers-color-scheme: dark) { :root { --text: #f5f5f7; --border: #48484a; } }
html, body { margin: 0; background: transparent; color: var(--text); }
body { font: 15px/1.6 -apple-system, "PingFang SC", sans-serif; padding: 12px 16px; }
#out { white-space: pre-wrap; overflow-x: auto; }
#out.formula { display: flex; justify-content: center; font-size: 17px; }
#out.formula .katex-display { margin: 0.4em 0; }
table { border-collapse: collapse; white-space: normal; }
td, th { border: 1px solid var(--border); padding: 4px 10px; }
.err { color: #d70015; }
</style>
</head>
<body>
<div id="out"></div>
<script>
// trust: false 禁用 \href、\url、\htmlClass 等命令；maxExpand 限制宏展开，防止恶意构造的公式卡死渲染
const OPTS = {throwOnError: false, trust: false, maxExpand: 1000, maxSize: 50};
const DELIMS = [
  {left: "$$", right: "$$", display: true}, {left: "\\[", right: "\\]", display: true},
  {left: "$", right: "$", display: false}, {left: "\\(", right: "\\)", display: false},
];
function esc(s) { return s.replace(/[&<>]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;"}[c])); }
function tableHtml(md) {
  const rows = md.trim().split("\n").filter(l => !/^\|\s*-/.test(l))
    .map(l => l.replace(/^\||\|$/g, "").split("|").map(c => c.trim()));
  return "<table>" + rows.map((r, i) => "<tr>" + r.map(c =>
    i === 0 ? `<th>${esc(c)}</th>` : `<td>${esc(c)}</td>`).join("") + "</tr>").join("") + "</table>";
}
function render(kind, text) {
  const out = document.getElementById("out");
  out.className = kind;
  try {
    if (kind === "formula") {
      katex.render(text, out, {...OPTS, displayMode: true});
      return;
    }
    out.innerHTML = kind === "table" ? tableHtml(text) : esc(text);
    renderMathInElement(out, {...OPTS, delimiters: DELIMS});
  } catch (e) {
    out.innerHTML = `<span class="err">${esc(String(e))}</span>`;
  }
}
</script>
</body>
</html>
